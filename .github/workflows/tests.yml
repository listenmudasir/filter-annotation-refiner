name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # PySide6 needs these even under the offscreen platform plugin.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libglib2.0-0 libdbus-1-3 libxkbcommon0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyflakes
          pip install "PySide6>=6.8,<7" "numpy>=1.26,<2" "Pillow>=10,<13" \
                      "opencv-python-headless>=4.9,<4.12" "PyYAML>=6.0"

      - name: Lint
        run: pyflakes refiner tests app.py

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
