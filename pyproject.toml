[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "filter-annotation-refiner"
version = "1.0.0"
description = "Dataset-level YOLO bounding-box to SAM polygon segmentation refinement workstation"
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
